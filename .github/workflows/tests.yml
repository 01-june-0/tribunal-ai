# Phase 1 of docs/PACKAGING.md: the test suite on macOS, Windows and Linux.
# No AI CLI is installed here and none is called: the suite runs on stand-ins (integration tests stay opt-in).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false            # one platform failing must not hide what the others say
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-22.04       # the oldest supported Python (pyproject: requires-python >= 3.9); newer images no longer carry 3.9
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4  # the console's JavaScript is tested through node (skipped without it)
        with:
          node-version: "20"

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Git identity for the tests' own repositories
        run: |
          git config --global user.name "tribunal-ci"
          git config --global user.email "tribunal-ci@users.noreply.github.com"

      - name: Test suite
        run: python -m pytest -q -p no:cacheprovider -W ignore

      - name: Windows shells reach Tribunal's stand-ins (table)
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_agent_mode.py -k windows_shells -s -rA -p no:cacheprovider -W ignore

      - name: Package builds and installs
        if: matrix.python == '3.13'
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m pip install --force-reinstall dist/*.whl
          tribunal doctor
        shell: bash

  # Phase 3 and 4: the install one-liners, run for real on clean runners against this commit. Each runs twice (the
  # second time is an update), the icon is started with the short PATH an icon gets - a real window on macOS and Windows
  # (TRIBUNAL_APP_SMOKE: it checks the console drew, then closes) - then everything is removed again.
  installer:
    name: installer · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      TRIBUNAL_SOURCE: ${{ github.workspace }}
      TRIBUNAL_NO_OPEN: "1"
      TRIBUNAL_ACCEPT_TERMS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install, then install again as an update
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          sh install.sh

      - name: The icon opens the console (macOS a window, Linux the browser)
        if: runner.os != 'Windows'
        run: |
          set -eu
          tribunal="$HOME/.local/bin/tribunal"
          "$tribunal" doctor
          if [ "$RUNNER_OS" = "macOS" ]; then
            # The window opens, the console draws in it, the window closes and the console it started goes off.
            launcher="$HOME/Applications/Tribunal AI.app/Contents/MacOS/tribunal-launch"
            test -x "$launcher"
            test -s "$HOME/Applications/Tribunal AI.app/Contents/Resources/tribunal.icns"
            env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin TRIBUNAL_APP_SMOKE=1 "$launcher"
            "$tribunal" doctor --json | python3 -c "import json, sys; r = json.load(sys.stdin); assert r['installed'] and not r['console'], r"
          else
            # No window library here: the icon opens the console in the browser (the check says so with exit 3).
            entry="$HOME/.local/share/applications/tribunal-ai.desktop"
            test -f "$entry"
            test -s "$(sed -n 's/^Icon=//p' "$entry")"
            command="$(sed -n 's/^Exec=//p' "$entry")"
            status=0
            env -i HOME="$HOME" PATH=/usr/bin:/bin BROWSER=true TRIBUNAL_APP_SMOKE=1 sh -c "$command" || status=$?
            test "$status" -eq 3
            "$tribunal" doctor --json | python3 -c "import json, sys; r = json.load(sys.stdin); print(r['console']); assert r['console'] and r['installed']"
            "$tribunal" stop
          fi

      - name: Uninstall removes the program and the icon, keeps the records
        if: runner.os != 'Windows'
        run: |
          set -eu
          sh uninstall.sh
          test ! -e "$HOME/.local/bin/tribunal"
          if [ "$RUNNER_OS" = "macOS" ]; then
            test ! -e "$HOME/Applications/Tribunal AI.app"
            test -d "$HOME/Library/Application Support/Tribunal AI/data"
          else
            test ! -e "$HOME/.local/share/applications/tribunal-ai.desktop"
            test -d "$HOME/.local/share/tribunal-ai/data"
          fi

      - name: Install, then install again as an update (Windows PowerShell 5.1, as pasted)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          Get-Content -Raw install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { throw "update failed" }

      - name: The icon opens the console in a window (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tribunal = "$env:USERPROFILE\.local\bin\tribunal.exe"
          & $tribunal doctor
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Tribunal AI.lnk'
          $desk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Tribunal AI.lnk'
          foreach ($p in @($menu, $desk)) { if (-not (Test-Path -LiteralPath $p)) { throw "missing $p" } }
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut($menu)
          Write-Host "$($lnk.TargetPath) $($lnk.Arguments)"
          if (-not ($lnk.TargetPath -like '*pythonw.exe')) { throw "the icon should start the window-less Python" }
          if (-not ($lnk.IconLocation -like '*tribunal.ico,0')) { throw "the shortcut should carry the app icon: $($lnk.IconLocation)" }
          # the shell may hand the path back folded into %APPDATA%: unfold it before looking
          if (-not (Test-Path -LiteralPath ([Environment]::ExpandEnvironmentVariables(($lnk.IconLocation -replace ',\d+$', ''))))) { throw "the icon file is missing" }
          # The window opens (Edge WebView2), the console draws in it, the window closes and the console goes off.
          $env:TRIBUNAL_APP_SMOKE = '1'
          $proc = Start-Process -FilePath $lnk.TargetPath -ArgumentList $lnk.Arguments -PassThru
          if (-not $proc.WaitForExit(240000)) { $proc.Kill(); throw "the window did not close by itself" }
          if ($proc.ExitCode -ne 0) {
            & $tribunal app --smoke                    # the same with a console, so the log shows why
            throw "the icon's program ended with $($proc.ExitCode)"
          }
          $report = (& $tribunal doctor --json | Out-String) | ConvertFrom-Json
          if ($report.console) { throw "the console the window started should be off: $($report.console)" }

      - name: Uninstall removes the program and the icons, keeps the records (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content -Raw uninstall.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed" }
          if (Test-Path "$env:USERPROFILE\.local\bin\tribunal.exe") { throw "tribunal.exe is still there" }
          foreach ($folder in @('Programs', 'Desktop')) {
            $p = Join-Path ([Environment]::GetFolderPath($folder)) 'Tribunal AI.lnk'
            if (Test-Path -LiteralPath $p) { throw "still there: $p" }
          }
          if (-not (Test-Path "$env:APPDATA\Tribunal AI\data")) { throw "the records should stay" }
