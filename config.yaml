# TRIBUNAL AI configuration
# Strict NO PAY-PER-USE API policy: every agent runs through an official, signed-in CLI session
# (Claude Code / OpenAI Codex / Google Antigravity). API keys in the environment are stripped before any CLI call.

architect:
  provider: claude        # ARCHITECT plans and directs corrections; the Inspector judges independently.
  # The model is whatever the CLI account's default model is; model flags are not passed through.
  executable: null        # Discovered automatically (PATH or the standard install folder)

maker:
  mode: proposal          # Maker returns whole files as JSON; the Director validates and writes them.
  provider: antigravity   # Primary MAKER: Google Antigravity CLI (failover: codex / claude)
  model: antigravity-cli
  executable: null        # Discovered automatically via resolve_cli('agy')

# Per-machine model for a CLI goes in the untracked config.local.yaml (see core/cli_models.py), e.g.
#   cli_models:
#     codex: gpt-6.1-sol
#   cli_options:              # lighter calls; claude_light is on unless set to false
#     claude_light: true
#     codex_light: true
#     codex_reasoning_effort: high
inspector:
  provider: codex         # Primary INSPECTOR: OpenAI Codex CLI (failover: claude)
  model: codex-cli
  executable: null        # Discovered automatically via resolve_cli('codex')

timeouts:
  architect: 300
  maker: 600
  inspector: 300
  no_progress: 180
  heartbeat: 30

safety:
  max_files_changed: 15
  max_diff_lines: 1500     # Complete greenfield modules commonly exceed 800; path/file caps still apply.
  approved_commands:
    - python
    - pytest
    - npm
    - cargo
    - go
    - make

verification:
  build_command: null
  test_command: "python -m pytest tests/"
  lint_command: null

bootstrap:
  enabled: true

# Per-project verification (kept here, never inside the project, so a Maker cannot weaken it).
# Keys are absolute project roots. Example:
# projects:
#   "D:/work/my_service":
#     verification:
#       build_command: ["npm", "run", "build"]
#       test_command: "python -m pytest -q"
projects: {}

autonomy:
  enabled: true
  max_repairs: 3
  # ARCHITECT proxy: ARCHITECT decides on the operator's behalf. Only money (payments, paid services, live-account orders),
  # real credentials/accounts and irreversible external actions stop for a human decision.
  architect_proxy: true
  maker_attempts: 3          # retry with feedback; the last attempt moves to another provider
  max_steps: 6                 # milestones per mission
  max_consecutive_failures: 3
  resume_on_start: true        # a companion restart continues interrupted (RUNNING) missions; STOPPED ones stay stopped
  # A finished mission is applied to the project on its own:
  # off | on_done (only when ARCHITECT declared the goal done) | on_pass (any PASSED deliverable).
  # Apply never overwrites a file the operator changed meanwhile (conflict -> blocked, worktree kept) and never deletes.
  auto_apply: on_pass
  profiles:                    # budgets per request size; gates and Scope Guard are the same in every profile
    quick:    {max_steps: 2, max_repairs: 1, maker_attempts: 2}
    standard: {max_steps: 6, max_repairs: 3, maker_attempts: 3}
    deep:     {max_steps: 12, max_repairs: 3, maker_attempts: 3}

# The bridge: where `director do` and other local programs hand in a goal (POST /bridge/missions, token required).
# Only git projects under allowed_roots may be targeted; the Director's own folder is never a target.
# TRIAD research is not startable from the console yet; its view switch in the workshop is hidden.
# triad:
#   console_switch: true

bridge:
  # "~" is expanded; a root that does not exist on this machine simply never matches.
  allowed_roots:
    - "D:/work"
    - "~/Developer"
  denied:
    - "D:/work/ai-dev-director"
    - "~/Developer/ai-dev-director"
    - "~/Developer/tribunal-ai"
